        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;

            user-select: none;
        }

            direction: rtl;
            line-height: 1.9;
        }

        /* Football Pitch & Stadium Pattern */
        .pitch-bg {
            background-color: #15803d;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.15) 2px, transparent 2px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.15) 2px, transparent 2px);
            background-size: 50px 50px;
        }

        .stadium-gradient {
            background: radial-gradient(circle at top, #b91c1c 0%, #7f1d1d 50%, #0f172a 100%);
        }

        /* Red Academy Card Styling */
        .academy-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.98));
            border: 2px solid rgba(239, 68, 68, 0.4);

        .player-card-bg {
            background: linear-gradient(145deg, #dc2626 0%, #991b1b 50%, #450a0a 100%);
            border: 3px solid #f59e0b;
        }

        /* Goal & Pulse Animations */
        @keyframes goalPop {
            0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .animate-goal {
            animation: goalPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes bounceSlow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .animate-bounce-slow {
            animation: bounceSlow 2s infinite ease-in-out;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #dc2626;
            border-radius: 4px;

    <script>
        // SOUND SYNTHESIZER (WEB AUDIO API)
        class SoundSynth {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (AudioContextClass) {
                        this.ctx = new AudioContextClass();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playKick() {
                this.init();
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    const now = this.ctx.currentTime;
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
                    gain.gain.setValueAtTime(0.8, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } catch (e) {}
            }

            playGoal() {
                this.init();
                if (!this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                    notes.forEach((freq, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.value = freq;
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        const startTime = now + (i * 0.08);
                        gain.gain.setValueAtTime(0, startTime);
                        gain.gain.linearRampToValueAtTime(0.3, startTime + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.35);
                        osc.start(startTime);
                        osc.stop(startTime + 0.35);
                    });
                } catch (e) {}
            }

            playTryAgain() {
                this.init();
                if (!this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const notes = [330, 261.63]; // E4, C4
                    notes.forEach((freq, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.value = freq;
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        const startTime = now + (i * 0.15);
                        gain.gain.setValueAtTime(0.25, startTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.25);
                        osc.start(startTime);
                        osc.stop(startTime + 0.25);
                    });
                } catch (e) {}
            }

            playWhistle() {
                this.init();
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    const now = this.ctx.currentTime;
                    osc.frequency.setValueAtTime(2500, now);
                    osc.frequency.setValueAtTime(2800, now + 0.05);
                    osc.frequency.setValueAtTime(2500, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } catch (e) {}
            }

            playHint() {
                this.init();
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    const now = this.ctx.currentTime;
                    osc.frequency.setValueAtTime(880, now);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } catch (e) {}
            }

            playClick() {
                this.init();
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    const now = this.ctx.currentTime;
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(400, now + 0.05);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } catch (e) {}
            }
        }

        // Utility: Fisher-Yates array shuffle
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;

                            <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 text-xs sm:text-sm space-y-2 mb-6">
                                <div>${evalItem("Mengenali Nun Sukun", this.state.stats.t1.correct, this.state.stats.t1.total)}</div>
                                <div>${evalItem("Mengenali Tanwin", this.state.stats.t2.correct, this.state.stats.t2.total)}</div>
                                <div>${evalItem("Membedakan Nun Sukun & Tanwin", this.state.stats.t3.correct, this.state.stats.t3.total)}</div>
                                <div>${evalItem("Detektif Tajwid", this.state.stats.t4.correct, this.state.stats.t4.total)}</div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <button onclick="app.resetState(); app.showLogin();" class="py-3.5 px-6 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-extrabold text-base transition flex items-center justify-center gap-2 border border-slate-600">
                                    <i class="fa-solid fa-rotate-right"></i>
                                    <span>🔄 ULANGI CHAPTER</span>
                                </button>
                                <button disabled class="py-3.5 px-6 rounded-2xl bg-slate-800/50 border border-slate-700 text-slate-500 font-extrabold text-base cursor-not-allowed flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-lock"></i>
                                    <span>CHAPTER 1 — QALQALAH (SEGERA HADIR)</span>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            restartGameConfirm() {
                if (confirm("Apakah Anda ingin mengulang permainan dari awal?")) {
                    this.resetState();
                    this.showLogin();
                }
            }

            resetState() {
                this.state.totalGoals = 0;
                this.state.questionIndex = 0;
                this.state.wrongAttempts = 0;
                this.state.hintLevel = 0;
                this.state.stats = {
                    t1: { correct: 0, wrong: 0, hints: 0, total: 10 },
                    t2: { correct: 0, wrong: 0, hints: 0, total: 10 },
                    t3: { correct: 0, wrong: 0, hints: 0, total: 15 },
                    t4: { correct: 0, wrong: 0, hints: 0, total: 10 },
                    final: { correct: 0, wrong: 0, hints: 0, total: 10 }
                };
            }
        }

        // Initialize application on window load
        let app;
        window.onload = function() {
            app = new AcademyApp();
            app.init();
        };
    </script>
</body>
</html>
